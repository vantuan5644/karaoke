# docker compose up -d, then open http://<this machine>:8765/tv on the TV's browser.
services:
  karaoke:
    build: .
    image: karaoke
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - karaoke-data:/data
    # The QR code on the TV shows the container's own address unless told otherwise:
    # command: ["-public-url", "http://192.168.1.20:8765"]

volumes:
  karaoke-data:
